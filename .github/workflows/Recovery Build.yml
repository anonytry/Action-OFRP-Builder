name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Device tree repository, for example https://github.com/anonytry/recovery_sky"
        required: true
        type: string

      device_tree_branch:
        description: "Device tree branch"
        required: false
        default: main
        type: string

      manifest_branch:
        description: "OrangeFox manifest branch"
        required: true
        default: 16.0
        type: choice
        options:
          - 16.0
          - 12.1

      notification_mode:
        description: "Telegram notification mode"
        required: true
        default: quiet
        type: choice
        options:
          - quiet
          - loud

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      SYNC_URL: https://gitlab.com/OrangeFox/sync.git
      MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_PATH: device/xiaomi/sky
      DEVICE_NAME: sky
      MAKEFILE_NAME: fox_sky-eng
      BUILD_TARGET: recovery
      TELEGRAM_CHAT_ID: ${{ inputs.notification_mode == 'quiet' && '-1002917930475' || '-1001480977582' }}
      TZ: Asia/Kolkata

    steps:
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Create Telegram sender script
      run: |
        cat <<'EOF' > /tmp/send_msg.sh
        #!/bin/bash
        curl -s --fail \
          -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
          -d text="$(printf "$1")" \
          -d parse_mode="Markdown" \
          -d disable_web_page_preview=true \
        > /dev/null 2>&1 || true
        EOF
        chmod +x /tmp/send_msg.sh

    - name: Prepare the build environment
      run: |
        /tmp/send_msg.sh "🧩 Preparing build environment..."
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
          linux-modules-extra-$(uname -r) \
          git python3 tar aria2 ccache
        curl -L -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: |
          17
          8

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        /tmp/send_msg.sh "🌐 Syncing OrangeFox sources..."
        git clone --depth=1 ${{ env.SYNC_URL }} sync
        cd sync
        ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path "$GITHUB_WORKSPACE/fox_${{ env.MANIFEST_BRANCH }}"

    - name: Prefer the classic zip signer
      run: |
        # zipsigner-3.0.jar rebuilds the whole archive through libziparchive,
        # which has produced zips whose recovery.img entry fails to inflate
        # with "invalid code lengths set". The classic path (signapk +
        # zipadjust + minsignapk) only shifts offsets and injects the
        # signature block, so it never touches the compressed payload.
        SIG="fox_${{ env.MANIFEST_BRANCH }}/vendor/recovery/signature"
        if [ -f "$SIG/zipsigner-3.0.jar" ]; then
          mv "$SIG/zipsigner-3.0.jar" "$SIG/zipsigner-3.0.jar.disabled"
          echo "disabled zipsigner-3.0.jar, OrangeFox falls back to signapk + zipadjust"
        else
          echo "zipsigner-3.0.jar not present, nothing to do"
        fi

    - name: Get bootable/recovery commit
      id: recovery_commit
      run: |
        cd "fox_${{ env.MANIFEST_BRANCH }}/bootable/recovery"
        COMMIT=$(git rev-parse --short=7 HEAD)
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "bootable/recovery: $COMMIT"

    - name: Clone device tree
      run: |
        /tmp/send_msg.sh "🌲 Cloning device tree for \`${{ env.DEVICE_NAME }}\`..."
        git clone --depth=1 "${{ env.DEVICE_TREE_URL }}" \
          -b "${{ env.DEVICE_TREE_BRANCH }}" \
          "fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}"

    - name: Get device tree commit
      id: devtree_commit
      run: |
        cd "fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}"
        COMMIT=$(git rev-parse --short=7 HEAD)
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "device tree: $COMMIT"

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 30

    - name: Show system resources
      run: |
        nproc && free -h && df -h

    - name: Build recovery
      run: |
        /tmp/send_msg.sh "⚙️ Starting build for \`${{ env.DEVICE_NAME }}\`..."
        cd "fox_${{ env.MANIFEST_BRANCH }}"

        set +e
        source build/envsetup.sh
        set -e

        export ALLOW_MISSING_DEPENDENCIES=true
        # OrangeFox signs the flashable zip with the java 8 zipsigner, and
        # leaves it unsigned (unusable for a dirty flash) without a java 8
        export FOX_JAVA8_PATH="$JAVA_HOME_8_X64/bin/java"
        lunch ${{ env.MAKEFILE_NAME }}

        if ! mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all); then
          /tmp/send_msg.sh "❌ Build failed for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`)\n🔗 [Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          exit 1
        fi

    - name: Notify build failure
      if: failure()
      run: /tmp/send_msg.sh "❌ Build failed for \`${{ env.DEVICE_NAME }}\` (\`${{ env.MANIFEST_BRANCH }}\`)\n🔗 [Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

    - name: Verify the flashable zip
      run: |
        set +e
        D="fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}"
        rc=0
        shopt -s nullglob
        for z in "$D"/OrangeFox-*.zip; do
          echo "### $(basename "$z"): $(stat -c%s "$z") bytes"
          if unzip -t "$z" > /tmp/zt.log 2>&1; then
            echo "### zip integrity: OK"
          else
            echo "### zip integrity: CORRUPT"
            tail -30 /tmp/zt.log
            rc=1
          fi
          ( cd "$(dirname "$z")" && md5sum "$(basename "$z")" | tee "$(basename "$z").md5" )
        done
        [ $rc -eq 0 ] || { /tmp/send_msg.sh "❌ Flashable zip failed \`unzip -t\`"; exit 1; }

    - name: Check the output directory
      run: ls -l "fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/"

    - name: Upload to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
          fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.img
          fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.zip
          fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.zip.md5
        fail_on_unmatched_files: false
        name: ${{ env.DEVICE_NAME }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.commit }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
          Device tree commit: [${{ steps.devtree_commit.outputs.commit }}](${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.commit }})
          bootable/recovery commit: [${{ steps.recovery_commit.outputs.commit }}](https://gitlab.com/OrangeFox/bootable/Recovery/tree/${{ steps.recovery_commit.outputs.commit }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify
      if: success()
      run: |
        /tmp/send_msg.sh "📦 *Build complete!*\n🔗 [Download](https://github.com/${{ github.repository }}/releases/tag/${{ github.run_id }})\n🌲 Device tree: [${{ steps.devtree_commit.outputs.commit }}](${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.commit }})\n🔁 bootable/recovery: [${{ steps.recovery_commit.outputs.commit }}](https://gitlab.com/OrangeFox/bootable/Recovery/tree/${{ steps.recovery_commit.outputs.commit }})"
